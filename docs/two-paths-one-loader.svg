<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img" aria-label="Both paths call one loader; only Continue reloads the page" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>Both paths call one loader; only Continue reloads the page</title>
  <rect width="760" height="262" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b8b4a8"/>
    </marker>
  </defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1c">Both paths call one loader; only Continue reloads the page</text>
  <text x="24" y="74" font-size="11.5" font-weight="600" fill="#6b6964">Without JavaScript</text>
  <text x="24" y="174" font-size="11.5" font-weight="600" fill="#6b6964">With JavaScript</text>
  <g fill="none" stroke="#b8b4a8" stroke-width="1.25">
    <path d="M176 110H208" marker-end="url(#arrow)"/>
    <path d="M360 110H384" marker-end="url(#arrow)"/>
    <path d="M176 210H208" marker-end="url(#arrow)"/>
    <path d="M360 210H384" marker-end="url(#arrow)"/>
    <path d="M504 110H536" marker-end="url(#arrow)"/>
    <path d="M504 210H536" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#b8b4a8" stroke-width="1.25">
    <rect x="24" y="86" width="152" height="48" rx="8"/>
    <rect x="208" y="86" width="152" height="48" rx="8"/>
    <rect x="24" y="186" width="152" height="48" rx="8"/>
    <rect x="208" y="186" width="152" height="48" rx="8"/>
    <rect x="536" y="82" width="176" height="56" rx="8"/>
    <rect x="536" y="182" width="176" height="56" rx="8"/>
  </g>
  <rect x="384" y="86" width="120" height="148" rx="8" fill="#2f6fdc" fill-opacity="0.12" stroke="#2f6fdc" stroke-width="2"/>
  <g text-anchor="middle" fill="#1f1e1c">
    <text x="100" y="114">Picks a code</text>
    <text x="284" y="114">Presses Continue</text>
    <text x="100" y="214">Changes the code</text>
    <text x="284" y="214">fetcher.load runs</text>
    <text x="444" y="158" font-weight="600">Same loader</text>
    <text x="444" y="176" font-size="11.5" fill="#6b6964">reads ?code</text>
    <text x="624" y="106" font-weight="600">New page, filled in</text>
    <text x="624" y="124" font-size="11.5" fill="#6b6964">Focus moves to the top</text>
    <text x="624" y="206" font-weight="600">Description updates</text>
    <text x="624" y="224" font-size="11.5" fill="#6b6964">Focus and URL stay put</text>
  </g>
</svg>
